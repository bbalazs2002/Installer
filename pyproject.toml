[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "installer"
dynamic = ["version"]
description = "Interactive installer for Dockerized GitHub release deployments"
requires-python = ">=3.10"
# No runtime dependencies: the installer uses only the Python standard library.
dependencies = []

[project.optional-dependencies]
dev = ["ruff", "mypy"]

[tool.setuptools.dynamic]
version = { attr = "installer.__version__" }

[tool.setuptools.packages.find]
where = ["src"]

[tool.ruff]
line-length = 100
target-version = "py310"
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP"]
# `ruff format` keeps the code within 100 columns; user-facing messages are long string
# literals that are better left unbroken than split mid-sentence.
ignore = ["E501"]

[tool.mypy]
python_version = "3.10"
mypy_path = "src"
strict = true
files = ["src/installer"]
