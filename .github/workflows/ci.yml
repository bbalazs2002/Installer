name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_call:

permissions:
  contents: read

jobs:
  test:
    name: Python ${{ matrix.python }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python: ["3.10", "3.12"]
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-python@v7
        with:
          python-version: ${{ matrix.python }}

      - name: System packages (whiptail and openssl are used by the tests)
        run: sudo apt-get update && sudo apt-get install -y whiptail openssl

      - name: Docker images for the real PostgreSQL tests
        run: |
          docker pull postgres:17-alpine
          docker pull postgres:15-alpine

      - name: Development tools
        run: python -m pip install --upgrade pip ruff mypy

      - name: Lint
        run: |
          ruff check .
          ruff format --check .

      - name: Types
        run: mypy

      - name: Tests (unit, integration, real Docker and real whiptail)
        run: python -m unittest discover -s tests -t . -v

      - name: Build the zipapp and smoke-test it
        run: |
          python scripts/build_pyz.py dist/installer.pyz
          python dist/installer.pyz --version
          # the same archive under the 0.1.x name must still answer as "telepito <version>"
          mkdir compat && cp dist/installer.pyz compat/telepito.pyz
          python compat/telepito.pyz --version | grep -E '^telepito [0-9]'
