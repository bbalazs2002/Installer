name: Release

# A tag like v0.2.0 runs the whole CI first. Only if it is green is a release created, with
# three assets:
#   installer.pyz  the installer (what the self-update of this and later versions downloads)
#   telepito.pyz   the same archive under the name that installers of the 0.1.x generation look
#                  for; the program reports the name of the file it runs from, so this copy
#                  answers `--version` as "telepito <version>", exactly as those installers
#                  require. Drop it once no 0.1.x installer is left.
#   SHA256SUMS     the sums of both files

on:
  push:
    tags: ["v[0-9]+.[0-9]+.[0-9]+*"]

permissions:
  contents: read

jobs:
  ci:
    uses: ./.github/workflows/ci.yml

  release:
    needs: ci
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-python@v7
        with:
          python-version: "3.10"

      - name: The tag must match the package version
        env:
          TAG: ${{ github.ref_name }}
        run: |
          version=$(PYTHONPATH=src python -c "import installer; print(installer.__version__)")
          if [ "v$version" != "$TAG" ]; then
            echo "Tag $TAG does not match installer.__version__ ($version)." >&2
            exit 1
          fi
          echo "VERSION=$version" >> "$GITHUB_ENV"

      - name: Build
        run: |
          python scripts/build_pyz.py dist/installer.pyz
          cp dist/installer.pyz dist/telepito.pyz
          cd dist
          sha256sum installer.pyz telepito.pyz > SHA256SUMS
          sha256sum --check SHA256SUMS

      - name: Smoke test (both names)
        run: |
          out=$(python dist/installer.pyz --version)
          test "$out" = "installer $VERSION"
          out=$(python dist/telepito.pyz --version)
          test "$out" = "telepito $VERSION"

      - name: Create the release
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ github.ref_name }}
        run: |
          flags=""
          case "$TAG" in *-*) flags="--prerelease" ;; esac
          gh release create "$TAG" dist/installer.pyz dist/telepito.pyz dist/SHA256SUMS \
            --title "$TAG" --generate-notes --verify-tag $flags
