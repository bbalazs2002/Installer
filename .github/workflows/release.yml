name: Release

# A tag like v0.2.0 runs the whole CI first. Only if it is green is a release created, with
# exactly two assets: telepito.pyz and its SHA256SUMS (what the self-update downloads).

on:
  push:
    tags: ["v[0-9]+.[0-9]+.[0-9]+*"]

permissions:
  contents: read

jobs:
  ci:
    uses: ./.github/workflows/ci.yml

  release:
    needs: ci
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.10"

      - name: The tag must match the package version
        env:
          TAG: ${{ github.ref_name }}
        run: |
          version=$(PYTHONPATH=src python -c "import telepito; print(telepito.__version__)")
          if [ "v$version" != "$TAG" ]; then
            echo "Tag $TAG does not match telepito.__version__ ($version)." >&2
            exit 1
          fi
          echo "VERSION=$version" >> "$GITHUB_ENV"

      - name: Build
        run: |
          python scripts/build_pyz.py dist/telepito.pyz
          cd dist
          sha256sum telepito.pyz > SHA256SUMS
          sha256sum --check SHA256SUMS

      - name: Smoke test
        run: |
          out=$(python dist/telepito.pyz --version)
          test "$out" = "telepito $VERSION"

      - name: Create the release
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ github.ref_name }}
        run: |
          flags=""
          case "$TAG" in *-*) flags="--prerelease" ;; esac
          gh release create "$TAG" dist/telepito.pyz dist/SHA256SUMS \
            --title "$TAG" --generate-notes --verify-tag $flags
